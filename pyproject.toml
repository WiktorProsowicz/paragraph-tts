[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paragraph_tts"
version = "0.1.0"
requires-python=">=3.11"
dependencies = [
    "torch>=2.6.0",
    "tensorboard>=2.18.0",
    "pandas>=2.3.2",
    "g2p_en>=2.1.0",
    "librosa>=0.11.0",
    "matplotlib>=3.2.2",
    "numpy>=2.2.6",
    "tqdm>=4.66.5",
    "hydra-core>=1.3.2",
    "gruut>=2.4.0",
    "transformers[sentencepiece]>=4.56.2",
    "ollama>=0.5.4",
    "lightning>=2.5.5",
    "speechbrain>=1.0.3"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18.1",
    "pre-commit>=4.3.0"

]
