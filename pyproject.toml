[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paragraph_tts"
version = "0.1.0"
requires-python=">=3.11"
dependencies = [
    "torch>=2.6.0",
    "tensorboard>=2.18.0",
    "pandas>=2.3.2",
    "librosa>=0.11.0",
    "matplotlib>=3.2.2",
    "numpy>=2.2.6",
    "tqdm>=4.66.5",
    "hydra-core>=1.3.2",
    "ollama>=0.5.4",
    "lightning>=2.6.1",
    "speechbrain>=1.0.3",
    "pytorch-fast-transformers>=0.4.0",
    "mlflow>=3.10.1"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ipykernel>=6.30.1",
    "pylint>=4.0.5",
    "autopep8>=2.3.2"
]

[tool.pylint."messages control"]
disable = [
    "fixme",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "R0801"
]

[tool.autopep8]
aggressive = true
max-line-length = 100
in-place = true

[tool.mypy]
disable_error_code = "import-untyped"
strict = true