---
run_cfg:
  mlflow_server_uri: http://localhost:5000
  mlflow_experiment: finding_stl_predictor_baseline
  mlflow_run: stl_predictor_cl_plus_weights
  mlflow_run_id: null
  seed: 2137
  continue_training_from_checkpoint:
  max_epochs: 10
  ds_path: data/stl_predictor_ds/stl_predictor_ds/
  batch_size: 8
  save_checkpoints: false
  num_workers: 16
  train_val_split: 0.95
  accumulate_grad_batches: 1
  viz_n_batches: 2
  viz_n_samples_per_batch: 8
  grad_clip_val: 1.5
  limit_train_batches: null

ds_cfg:
  include_stl_series: faster_bin_diversity_6

optimizer_cfg:
  learning_rate: 1e-3
  weight_decay: 1e-6
  betas: [0.9, 0.98]
  eps: 1e-8

train_cfg:
  loss_init_weights:
    gst_pred_loss: 8.0
    wsv_pred_loss: 10.0
    moe_lb_loss: 0.05
    moe_z_loss: 0.005
    wsv_cl_loss: 0.6
  loss_weight_decays:
    gst_pred_loss: 1.0
    wsv_pred_loss: 1.0
    moe_lb_loss: 1.0
    moe_z_loss: 1.0
    wsv_cl_loss: 1.0
  wsv_cl_pos_weight: 20.0

model_cfg:
  encoder:
    input_embedding_dim: 1024
    hidden_dim: 1024
    num_heads: 8
    fft_proj_dim: 1536
    n_experts: 6
    top_k_experts: 2
    num_layers: 4
    gst_weights_dim: 16
    wsv_weights_dim: 128
    dropout: 0.1
    use_wsv_classification: true
  output_mode: classification-plus-weights
