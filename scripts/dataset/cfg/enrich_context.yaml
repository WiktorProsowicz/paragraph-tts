---
model_name: mistral:7b
ollama_host: http://localhost:11434
raw_ds_path: tmp/LibriTTS_R
output_path: tmp/enriched_context
max_paragraph_len: 6
min_paragraph_len: 3
num_contexts_to_generate: 3
max_enriched_paragraphs: 1000
filters:
  max_words_in_utterance: 100
  choose_splits:
    [
      "dev-clean",
      "dev-other",
      "test-clean",
      "test-other",
      "train-clean-100",
      "train-clean-360",
      "train-other-500",
    ]
  allow_fragmented_sentences: false
