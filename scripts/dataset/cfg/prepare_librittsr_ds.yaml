---
raw_ds_path: tmp/LibriTTS_R
choose_splits: null
alignments_path: data/librittsr_alignments
output_dir: tmp/librittsr_processed
metadata_output_dir: tmp/librittsr_processing_metadata

processor_cfg:
  multi_speaker: true
  embedders_device: cuda
  n_word_boundaries: [5, 180]
  n_utterance_boundaries: [1, 10]
  duration_boundaries: [1.0, 30.0]
  bert_embedder_model: microsoft/deberta-v3-large
  audio_processing_cfg:
    sr: 22050
    hop_length: 256
    win_length: 1024
    n_mels: 80
    fmin: 0
    fmax: 8000
    trim_top_db: 23